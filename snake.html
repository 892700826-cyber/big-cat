<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
}
canvas {
  border: 2px solid #0ff;
  box-shadow: 0 0 20px #0ff4, 0 0 60px #0ff2;
  border-radius: 4px;
  image-rendering: pixelated;
}
#ui {
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 40px;
  color: #0ff;
  font-size: 18px;
  text-shadow: 0 0 8px #0ff, 0 0 20px #0ff6;
  font-weight: bold;
  letter-spacing: 1px;
  user-select: none;
  z-index: 10;
}
#ui span { color: #f0f; text-shadow: 0 0 8px #f0f, 0 0 20px #f0f6; }
</style>
</head>
<body>
<div id="ui"><div>SCORE <span id="score">0</span></div><div>HIGH <span id="high">0</span></div></div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highEl = document.getElementById('high');

const COLS = 20, ROWS = 20;
const MIN_SIZE = 420;

let S, CELL;

function calcSize() {
  S = Math.floor(Math.min(window.innerWidth - 40, window.innerHeight - 100, MIN_SIZE));
  S = Math.max(280, S);
  CELL = S / COLS;
}

calcSize();
canvas.width = canvas.height = S;

const DIR = { UP: [0, -1], DOWN: [0, 1], LEFT: [-1, 0], RIGHT: [1, 0] };
const KEY_MAP = { w: 'UP', s: 'DOWN', a: 'LEFT', d: 'RIGHT' };

let snake, food, dir, nextDir, score, gameOver, paused, particles, frameCount, speed;

let highScore = parseInt(localStorage.getItem('snake_high') || '0');

function randCol() {
  const hues = [0, 45, 120, 180, 240, 300, 330];
  return `hsl(${hues[Math.floor(Math.random() * hues.length)]}, 100%, 60%)`;
}

function init() {
  const mid = Math.floor(COLS / 2);
  snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
  dir = 'RIGHT';
  nextDir = 'RIGHT';
  score = 0;
  gameOver = false;
  paused = false;
  particles = [];
  frameCount = 0;
  speed = 8;
  spawnFood();
  scoreEl.textContent = '0';
  highEl.textContent = highScore;
}

function spawnFood() {
  let p;
  do {
    p = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === p.x && s.y === p.y));
  food = p;
  food.col = randCol();
}

function spawnParticles(x, y, col) {
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 1 + Math.random() * 4;
    particles.push({
      x: x * CELL + CELL / 2,
      y: y * CELL + CELL / 2,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1,
      decay: 0.015 + Math.random() * 0.025,
      size: 2 + Math.random() * 4,
      col
    });
  }
}

function update() {
  if (gameOver || paused) return;
  frameCount++;
  if (frameCount % Math.max(3, 12 - Math.floor(speed / 3)) !== 0) return;

  dir = nextDir;
  const [dx, dy] = DIR[dir];
  const head = { x: snake[0].x + dx, y: snake[0].y + dy };

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver = true;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snake_high', highScore);
      highEl.textContent = highScore;
    }
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    speed = Math.min(30, 8 + Math.floor(score / 3));
    scoreEl.textContent = score;
    spawnParticles(food.x, food.y, food.col);
    spawnFood();
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#ffffff08';
  ctx.lineWidth = 1;
  for (let i = 1; i < COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
  }
  for (let i = 1; i < ROWS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
  }

  const fx = food.x * CELL, fy = food.y * CELL;
  ctx.shadowColor = food.col;
  ctx.shadowBlur = 18;
  ctx.fillStyle = food.col;
  ctx.fillRect(fx + 1, fy + 1, CELL - 2, CELL - 2);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(fx + 4, fy + 4, CELL - 8, CELL - 8);

  for (let i = 0; i < snake.length; i++) {
    const s = snake[i];
    const pad = 1;
    const x = s.x * CELL + pad, y = s.y * CELL + pad;
    const w = CELL - pad * 2;
    const t = 1 - i / snake.length;
    const hue = 140 + i * 3.5;
    const lightness = 45 + t * 35;
    const col = `hsl(${hue}, 100%, ${lightness}%)`;

    ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
    ctx.shadowBlur = i === 0 ? 20 : 6;
    ctx.fillStyle = col;

    const gap = 1;
    const rx = x + gap, ry = y + gap, rw = w - gap * 2, rh = w - gap * 2;
    const cr = 2;
    ctx.beginPath();
    ctx.moveTo(rx + cr, ry);
    ctx.lineTo(rx + rw - cr, ry);
    ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + cr);
    ctx.lineTo(rx + rw, ry + rh - cr);
    ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - cr, ry + rh);
    ctx.lineTo(rx + cr, ry + rh);
    ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - cr);
    ctx.lineTo(rx, ry + cr);
    ctx.quadraticCurveTo(rx, ry, rx + cr, ry);
    ctx.closePath();
    ctx.fill();

    if (i === snake.length - 1) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = `hsla(${hue}, 100%, 30%, 0.5)`;
      ctx.beginPath();
      ctx.arc(x + w / 2, y + w / 2, w * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    if (i === 0) {
      ctx.shadowBlur = 0;
      const eyeOff = CELL * 0.22;
      const pupilOff = 1.2;
      ctx.fillStyle = '#fff';
      if (dir === 'RIGHT') {
        ctx.beginPath(); ctx.arc(x + w - eyeOff, y + eyeOff, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + w - eyeOff, y + w - eyeOff, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(x + w - eyeOff + pupilOff, y + eyeOff, 1.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + w - eyeOff + pupilOff, y + w - eyeOff, 1.2, 0, Math.PI * 2); ctx.fill();
      } else if (dir === 'LEFT') {
        ctx.beginPath(); ctx.arc(x + eyeOff, y + eyeOff, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + eyeOff, y + w - eyeOff, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(x + eyeOff - pupilOff, y + eyeOff, 1.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + eyeOff - pupilOff, y + w - eyeOff, 1.2, 0, Math.PI * 2); ctx.fill();
      } else if (dir === 'UP') {
        ctx.beginPath(); ctx.arc(x + eyeOff, y + eyeOff, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + w - eyeOff, y + eyeOff, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(x + eyeOff, y + eyeOff - pupilOff, 1.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + w - eyeOff, y + eyeOff - pupilOff, 1.2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(x + eyeOff, y + w - eyeOff, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + w - eyeOff, y + w - eyeOff, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(x + eyeOff, y + w - eyeOff + pupilOff, 1.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + w - eyeOff, y + w - eyeOff + pupilOff, 1.2, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  ctx.shadowBlur = 0;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.06;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.shadowColor = p.col;
    ctx.shadowBlur = 12;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  if (gameOver) {
    ctx.fillStyle = '#000a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f44';
    ctx.shadowColor = '#f44';
    ctx.shadowBlur = 35;
    ctx.font = `bold ${CELL * 1.6}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - CELL * 0.8);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#aaa';
    ctx.font = `${CELL * 0.55}px 'Courier New', monospace`;
    ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + CELL * 0.4);
    ctx.fillStyle = '#fff';
    ctx.font = `${CELL * 0.5}px 'Courier New', monospace`;
    ctx.fillText('Press J to restart', canvas.width / 2, canvas.height / 2 + CELL * 1.4);
  } else if (paused) {
    ctx.fillStyle = '#000a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 35;
    ctx.font = `bold ${CELL * 1.8}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
    ctx.shadowBlur = 0;
  }
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k in KEY_MAP) {
    e.preventDefault();
    const nd = KEY_MAP[k];
    const [dx, dy] = DIR[nd];
    const [cdx, cdy] = DIR[dir];
    if (dx + cdx !== 0 || dy + cdy !== 0) nextDir = nd;
  }
  if (k === 'j') {
    e.preventDefault();
    if (gameOver) { init(); return; }
    paused = !paused;
  }
});

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

init();
loop();

// ----- Touch controls (swipe) -----
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!touchStartX) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  touchStartX = 0;
  const adx = Math.abs(dx), ady = Math.abs(dy);
  if (adx < 10 && ady < 10) {
    // tap = toggle pause / restart
    if (gameOver) { init(); return; }
    paused = !paused;
    return;
  }
  let nd;
  if (adx > ady) nd = dx > 0 ? 'RIGHT' : 'LEFT';
  else nd = dy > 0 ? 'DOWN' : 'UP';
  const [dx2, dy2] = DIR[nd];
  const [cdx, cdy] = DIR[dir];
  if (dx2 + cdx !== 0 || dy2 + cdy !== 0) nextDir = nd;
});
canvas.addEventListener('touchmove', e => e.preventDefault());

window.addEventListener('resize', () => {
  calcSize();
  canvas.width = canvas.height = S;
});
</script>
</body>
</html>
